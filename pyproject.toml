[tool.poetry]
name = "opendevin"
version = "0.1.0"
description = "OpenDevin: Code Less, Make More"
authors = ["OpenDevin"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/OpenDevin/OpenDevin"

[tool.poetry.dependencies]
python = "^3.11"
datasets = "*"
PyGithub = "*"
pandas = "*"
litellm = "*"
termcolor = "*"
seaborn = "*"
docker = "*"
fastapi = "*"
toml = "*"
tomlkit = "*"
uvicorn = "*"
types-toml = "*"
numpy = "*"
json-repair = "*"
playwright = "*"

[tool.poetry.group.gptswarm.dependencies]
serpapi = "0.1.5"
gptswarm = "0.1.0"

[tool.poetry.group.llama-index.dependencies]
llama-index = "*"
llama-index-vector-stores-chroma = "*"
chromadb = "*"
llama-index-embeddings-huggingface = "*"
llama-index-embeddings-azure-openai = "*"
llama-index-embeddings-ollama = "*"
pymupdfb = "*"

[tool.poetry.group.dev.dependencies]
ruff = "*"
mypy = "*"
pre-commit = "*"

[tool.poetry.group.test.dependencies]
pytest = "*"





[build-system]
build-backend = "poetry.core.masonry.api"
# This file uses both the modern PEP 621 format ([project]) and the Poetry-specific format ([tool.poetry])
# for backward compatibility. The warnings from `poetry check` about duplicate fields are expected and can be ignored.
# The [project] section is the primary configuration, and the [tool.poetry] section is kept for compatibility.

requires = [
  "poetry-core",
]
# Main dependencies (mirrors [tool.poetry.dependencies] for UV compatibility)
dependencies = [
  "aiohttp>=3.9,!=3.11.13",
  "anthropic[vertex]",
  "anyio==4.9",
  "asyncpg>=0.30",
  "bashlex>=0.18",
  "boto3",
  "browsergym-core==0.13.3",
  "deprecated",
