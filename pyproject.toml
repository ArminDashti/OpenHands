optional-dependencies.third_party_runtimes = [
  "daytona==0.24.2",
  "e2b-code-interpreter>=2",
  "modal>=0.66.26,<1.2",
  "runloop-api-client==0.50",
]
urls.Homepage = "https://github.com/OpenHands/OpenHands"
urls.Repository = "https://github.com/OpenHands/OpenHands"

[dependency-groups]
dev = [
  "build",
  "mypy==1.17",
  "pre-commit==4.2",
  "pytest>=8.4",
  "pytest-asyncio>=1.3",
  "ruff==0.12.5",
  "types-setuptools",
]
test = [
  "gevent>=24.2.1,<26",
  "pandas",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-forked",
  "pytest-playwright>=0.7",
  "pytest-timeout>=2.4",
  "pytest-xdist",
  "reportlab",
]
runtime = [
  "flake8",
  "jupyterlab",
  "notebook",
]
evaluation = [
  "boto3-stubs[s3]>=1.37.19",
  "browsergym==0.13.3",
  "browsergym-miniwob==0.13.3",
  "browsergym-visualwebarena==0.13.3",
  "browsergym-webarena==0.13.3",
  "commit0",
  "datasets",
  "evaluate",
  "func-timeout",
  "gdown",
  "joblib",
  "matplotlib",
  "multi-swe-bench==0.1.2",
  "pandas",
  "pyarrow==21",
  "retry",
  "seaborn",
  "streamlit",
  "swebench",
  "swegym",
  "sympy",
  "tabulate",
  "visualswebench",
  "whatthepatch",
]
testgeneval = [
  "fuzzywuzzy>=0.18",
  "python-levenshtein>=0.26.1,<0.28",
  "rouge>=1.0.1",
  "tree-sitter-python>=0.23.6",
]

# UV source configuration for git dependencies in evaluation group

[tool.autopep8]
ignore = [ "E501" ]

[tool.black]
skip-string-normalization = true

[tool.ruff.lint]
select = ["D"]
# ignore warnings for missing docstrings
ignore = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"



[tool.poetry.group.evaluation.dependencies]
torch = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
