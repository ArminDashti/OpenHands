  "openhands-tools==1.8.1",
  "opentelemetry-api>=1.33.1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.33.1",
  "pathspec>=0.12.1",
  "pexpect",
  "pg8000>=1.31.5",
  "pillow>=11.3",
  "playwright>=1.55",
  "poetry>=2.1.2",
  "prompt-toolkit>=3.0.50",
  "protobuf>=5,<6",
  "psutil",
  "pybase62>=1",
  "pygithub>=2.5",
  "pyjwt>=2.9",
  "pylatexenc",
  "pypdf>=6",
  "python-docx",
  "python-dotenv",
  "python-frontmatter>=1.1",
  "python-jose[cryptography]>=3.3",
  "python-json-logger>=3.2.1",
  "python-multipart",
  "python-pptx",
  "python-socketio>=5.11.4",
  "pythonnet",
  "pyyaml>=6.0.2",
  "qtconsole>=5.6.1",
  "rapidfuzz>=3.9",
  "redis>=5.2,<7",
  "requests>=2.32.5",
  "setuptools>=78.1.1",
  "shellingham>=1.5.4",
